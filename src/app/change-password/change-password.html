<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <h2>Action Required</h2>
            <p>Please change your default password to continue</p>
        </div>

        <form class="login-form" (ngSubmit)="onSubmit()" #changePasswordForm="ngForm" novalidate>
            <div class="form-group">
                <div class="input-wrapper password-wrapper">
                    <input type="password" id="newPassword" name="newPassword" [(ngModel)]="newPassword"
                        (ngModelChange)="onPasswordChange()" required autocomplete="new-password">
                    <label for="newPassword">New Password</label>
                    <span class="focus-border"></span>
                    <div class="input-group-addon">
                        <a href="javascript:void(0)"><i class="fa fa-eye-slash" aria-hidden="true"></i></a>
                    </div>
                </div>
            </div>

            <!-- Live password requirements checklist — visible once the user starts typing -->
            @if (unmetRequirements.length > 0) {
            <ul class="password-requirements">
                @for (req of unmetRequirements; track req.label) {
                <li class="requirement-unmet">
                    <span class="requirement-icon">✗</span>
                    {{ req.label }}
                </li>
                }
            </ul>
            }

            <div class="form-group">
                <div class="input-wrapper password-wrapper">
                    <input type="password" id="confirmPassword" name="confirmPassword" [(ngModel)]="confirmPassword"
                        required autocomplete="new-password">
                    <label for="confirmPassword">Confirm Password</label>
                    <span class="focus-border"></span>
                    <div class="input-group-addon">
                        <a href="javascript:void(0)"><i class="fa fa-eye-slash" aria-hidden="true"></i></a>
                    </div>
                </div>
            </div>

            <button type="submit" class="login-btn btn"
                [disabled]="newPassword && (!isPasswordValid || newPassword !== confirmPassword)">
                <span class="btn-text">Update Password</span>
            </button>
        </form>

        <!-- Validation / backend errors -->
        @if (errors.length > 0) {
        <ul class="error-list">
            @for (err of errors; track err) {
            <li class="error-message">{{ err }}</li>
            }
        </ul>
        }
    </div>
</div>
