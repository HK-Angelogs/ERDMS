<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <h2>Create Account</h2>
            <p>Register a new account</p>
        </div>

        <form class="login-form" (ngSubmit)="register()" #registerForm="ngForm" novalidate>
            <div class="form-group">
                <div class="input-wrapper">
                    <input type="text" id="username" name="username" [(ngModel)]="username" required
                        autocomplete="username">
                    <label for="username">Username</label>
                    <span class="focus-border"></span>
                </div>
            </div>

            <div class="form-group">
                <div class="input-wrapper password-wrapper">
                    <input type="password" id="password" name="password" [(ngModel)]="password"
                        (ngModelChange)="onPasswordChange()" required autocomplete="new-password">
                    <label for="password">Password</label>
                    <span class="focus-border"></span>
                </div>
            </div>

            <!-- Live password requirements checklist — visible once the user starts typing -->
            @if (unmetRequirements.length > 0) {
            <ul class="password-requirements">
                @for (req of unmetRequirements; track req.label) {
                <li class="requirement-unmet">
                    <span class="requirement-icon">✗</span>
                    {{ req.label }}
                </li>
                }
            </ul>
            }

            <button type="submit" class="login-btn btn" [disabled]="password && !isPasswordValid">
                <span class="btn-text">Register</span>
            </button>
        </form>

        <!-- Validation / backend errors -->
        @if (errors.length > 0) {
        <ul class="error-list">
            @for (err of errors; track err) {
            <li class="error-message">{{ err }}</li>
            }
        </ul>
        }

        <div class="signup-link">
            <p>
                Already have an account?
                <a routerLink="/login">Login here</a>
            </p>
        </div>
    </div>
</div>
